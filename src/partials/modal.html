<div class="modal" data-modal hidden aria-hidden="true">
  <div
    class="modal__window"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <button class="modal__close" type="button" data-modal-close aria-label="Close">
      <svg class="modal__close-icon" width="24" height="24" aria-hidden="true">
        <use href="./img/sprite.svg#icon-close"></use>
      </svg>
    </button>

    <div class="modal__content">
      <h2 class="modal__title" id="modal-title">Thank You for Your Inquiry!</h2>

      <picture>
        <source
          media="(max-width: 767px)"
          srcset="
            ./img/modal/thank-you-mobile.webp    1x,
            ./img/modal/thank-you-mobile@2x.webp 2x
          "
        />
        <source
          media="(max-width: 1439px)"
          srcset="
            ./img/modal/thank-you-tablet.webp    1x,
            ./img/modal/thank-you-tablet@2x.webp 2x
          "
        />
        <img
          class="modal__image"
          src="./img/modal/thank-you.webp"
          srcset="
            ./img/modal/thank-you.webp    1x,
            ./img/modal/thank-you@2x.webp 2x
          "
          alt="A cup of coffee, a handwritten thank-you note, eucalyptus and wedding photos on a linen tablecloth"
          width="640"
          height="394"
          loading="lazy"
          decoding="async"
        />
      </picture>

      <p class="modal__text">
        I have received your message and I'm so excited about your interest! I
        will get in touch with you within 24-48 hours to discuss the details of
        your wedding day. In the meantime, feel free to browse my portfolio or
        follow me on Instagram for more inspiration.
      </p>
    </div>
  </div>
</div>
