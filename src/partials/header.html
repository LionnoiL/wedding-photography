<header class="header">
  <div class="container header-container">
    <a href="#hero" class="logo" aria-label="Maria Kovalenko Photography">
      <svg
        width="70"
        height="55"
        viewBox="0 0 70 55"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <use href="/img/sprite.svg#icon-logo"></use>
      </svg>
    </a>

    <nav class="nav">
      <ul class="nav-list">
        <li><a href="#about" class="nav-link">About Me</a></li>
        <li><a href="#benefits" class="nav-link">Benefits</a></li>
        <li><a href="#portfolio" class="nav-link">Portfolio</a></li>
        <li><a href="#faq" class="nav-link">FAQ</a></li>
      </ul>
      <a href="#contacts" class="btn header-btn">Book a Session</a>
    </nav>

    <button class="burger-btn" type="button" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <use href="/img/sprite.svg#icon-burger"></use>
      </svg>
    </button>
  </div>

  <div class="mobile-menu" id="mobile-menu">
    <div class="mobile-menu-top">
      <a href="#hero" class="logo">
        <svg width="70" height="55" viewBox="0 0 70 55" fill="none">
          <use href="/img/sprite.svg#icon-logo"></use>
        </svg>
      </a>
      <button class="mobile-menu-close" type="button" aria-label="Close menu">
        &times;
      </button>
    </div>

    <div class="mobile-menu-body">
      <ul class="mobile-menu-list">
        <li><a href="#about" class="mobile-menu-link">About Me</a></li>
        <li><a href="#benefits" class="mobile-menu-link">Benefits</a></li>
        <li><a href="#portfolio" class="mobile-menu-link">Portfolio</a></li>
        <li><a href="#faq" class="mobile-menu-link">FAQ</a></li>
      </ul>

      <a href="#contacts" class="btn mobile-menu-btn">Book a Session</a>
    </div>
  </div>
</header>
