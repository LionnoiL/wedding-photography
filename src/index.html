<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Photography</title>
    <meta
      name="description"
      content="Maria Kovalenko Photography — wedding photographer in Berlin. Capturing genuine emotions and timeless memories of your special day. Book a session."
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        %BASE_URL%img/hero/hero-mob-bg.webp    1x,
        %BASE_URL%img/hero/hero-mob-bg@2x.webp 2x
      "
      media="(max-width: 767px)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        %BASE_URL%img/hero/hero-tab-bg.webp    1x,
        %BASE_URL%img/hero/hero-tab-bg@2x.webp 2x
      "
      media="(min-width: 768px) and (max-width: 1439px)"
    />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        %BASE_URL%img/hero/hero-desk-bg.webp    1x,
        %BASE_URL%img/hero/hero-desk-bg@2x.webp 2x
      "
      media="(min-width: 1440px)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500&family=Mulish:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500&family=Mulish:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/hero.html" />
      <load src="./partials/about.html" />
      <load src="./partials/benefits.html" />
      <load src="./partials/feedbacks.html" />
      <load src="./partials/portfolio.html" />
      <load src="./partials/faq.html" />
      <load src="./partials/contacts.html" />
    </main>

    <load src="./partials/footer.html" />

    <load src="./partials/scroll-up.html" />
    <load src="./partials/modal.html" />
    <load src="./partials/loader.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
